name: JEEV Empire Run
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 3 AM PKT auto
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f JEEV-Empire/requirements.txt ]; then pip install -r JEEV-Empire/requirements.txt; fi

      - name: Run zindagi.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -f "JEEV-Empire/zindagi.py" ]; then
            python JEEV-Empire/zindagi.py
          elif [ -f "zindagi.py" ]; then
            python zindagi.py
          else
            echo "zindagi.py not found!"
            exit 1
          fi

      - name: Commit and Push Report - DATED - KABHI NAHI UREGA!
        if: always()
        run: |
          git config --global user.name "JEEV AI Bot"
          git config --global user.email "jeev-bot@github.com"
          mkdir -p reports
          mkdir -p JEEV-Empire/reports
          # Dated files - Har run pe naya naam - Purana nahi urega!
          # cp reports/*.md to root for email link
          ls -la reports/ || true
          ls -la JEEV-Empire/reports/ || true
          ls -la *.md || true
          git add -A
          git commit -m "🤖 JEEV Report $(date '+%Y-%m-%d %H:%M') - Never Delete" || echo "Nothing to commit"
          git push || (git pull --rebase && git push) || true