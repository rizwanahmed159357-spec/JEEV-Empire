name: JEEV Empire
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
concurrency:
  group: jeev-final-10
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install requests
      - run: timeout 60 python zindagi.py || echo "Done"
      - name: Save wallet and bots
        run: |
          git config --global user.name "JEEV Bot"
          git config --global user.email "jeev@bot.com"
          git add jeev_wallet.json jeev_bots.json jeev_atma.json || echo "No files"
          git diff --cached --quiet || git commit -m "JEEV Update: Osaf wallet + bots"
          git push || echo "Push done"