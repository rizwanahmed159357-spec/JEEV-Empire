name: JEEV Empire Run

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f JEEV-Empire/requirements.txt ]; then pip install -r JEEV-Empire/requirements.txt; fi

      - name: Run zindagi.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -f "JEEV-Empire/zindagi.py" ]; then
            python JEEV-Empire/zindagi.py
          elif [ -f "zindagi.py" ]; then
            python zindagi.py
          else
            echo "zindagi.py not found!"
            exit 1
          fi

      - name: Commit and Push Report
        if: always()
        run: |
          git config --global user.name "JEEV AI Bot"
          git config --global user.email "jeev-bot@github.com"
          if [ -f "JEEV-Empire/JEEV_FINAL_REPORT.md" ]; then
            cp JEEV-Empire/JEEV_FINAL_REPORT.md ./JEEV_FINAL_REPORT.md || true
          fi
          ls -la *.md || true
          ls -la JEEV-Empire/*.md || true
          git add -A
          git commit -m "🤖 JEEV Report - $(date)" || echo "Nothing to commit"
          git push || (git pull --rebase && git push) || true

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 JEEV AI (Solidity) - Report Ready!"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: JEEV AI Bot <${{ secrets.EMAIL_USERNAME }}>
          html_body: |
            <html><body>
            <h2>🚨 JEEV AI - Solidity Report Ready!</h2>
            <p><b>Report:</b> <a href="https://github.com/JEEV-Empire/JEEV-Empire/blob/main/JEEV_FINAL_REPORT.md">GitHub Report Link</a></p>
            <p>Model: Solidity Scanner Active</p>
            <p>File GitHub pe push ho gayi hai!</p>
            </body></html>