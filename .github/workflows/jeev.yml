name: JEEV Empire
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Find and Run
        run: |
          pwd
          ls -la
          echo "--- Finding zindagi.py ---"
          find . -name "zindagi.py"
          FILE=$(find . -name "zindagi.py" | head -1)
          echo "Running $FILE"
          python "$FILE"