name: JEEV Empire Run
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 */2 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install requests openai Pillow
      - name: Run bot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GMAIL_USER: ${{ secrets.EMAIL_USERNAME }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python JEEV-Empire/zindagi.py
      - name: Push reports
        if: always()
        run: |
          git config --global user.name "JEEV AI Bot"
          git config --global user.email "jeev-bot@github.com"
          git add reports JEEV-Empire/reports JEEV-Empire/*.json jeev_wallet.json -f || true
          git add -A || true
          git commit -m "bot report ${{ github.run_number }}" || true
          git push || true