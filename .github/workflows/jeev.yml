name: JEEV Empire
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: jeev-empire
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run JEEV
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          timeout 60 python JEEV.py || echo "JEEV.py timeout but ok"
          timeout 60 python jeev_empire.py || echo "Empire timeout but ok"
          echo "DONE - JEEV ZINDA"