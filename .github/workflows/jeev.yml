name: JEEV Empire
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
concurrency:
  group: jeev-final-10
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install requests
      - name: Check files
        run: |
          pwd
          ls -la
          echo "--- Finding zindagi.py ---"
          find . -name "zindagi.py" -type f
      - name: Run JEEV
        run: python ./zindagi.py