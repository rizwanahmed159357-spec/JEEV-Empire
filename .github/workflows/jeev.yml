name: JEEV Empire
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python3 zindagi.py

      - name: Save Wallet Permanently
        run: |
          git config user.name "JEEV Bot"
          git config user.email "jeev@empire.com"
          git add jeev_wallet.json
          git commit -m "JEEV: Total $30 added" || echo "Nothing to commit"
          git push