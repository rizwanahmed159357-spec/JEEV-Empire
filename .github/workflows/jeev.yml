name: JEEV Empire Run
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 */2 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai Pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f JEEV-Empire/requirements.txt ]; then pip install -r JEEV-Empire/requirements.txt; fi

      - name: Run zindagi.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GMAIL_USER: ${{ secrets.EMAIL_USERNAME }}
          GMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ -f "JEEV-Empire/zindagi.py" ]; then
            python JEEV-Empire/zindagi.py
          elif [ -f "zindagi.py" ]; then
            python zindagi.py
          else
            echo "zindagi.py not found!"
            exit 1
          fi

      - name: Commit and Push Report - DATED - KABHI NAHI UREGA!
        if: always()
        run: |
          git config --global user.name "JEEV AI Bot"
          git config --global user.email "jeev-bot@github.com"
          mkdir -p reports
          mkdir -p JEEV-Empire/reports
          ls -la reports/ || true
          ls -la JEEV-Empire/reports/ || true
          git add reports/ JEEV-Empire/reports/ JEEV-Empire/*.json jeev_wallet.json || true
          git add -A
          git commit -m "🤖 JEEV Report $(date '+%Y-%m-%d %H:%M') - FREE Cantina + BUG Screenshot - Never Delete - ${{ github.run_number }}" || echo "Nothing to commit"
          git push || (git pull --rebase && git push) || true