name: JEEV Hibernation Alarm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  check-jeev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install requests
        run: python -m pip install requests
      - name: JEEV Utho
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python JEEV.py